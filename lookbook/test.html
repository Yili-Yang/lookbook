<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Tests</title></head>
<body>
<pre id="out"></pre>
<script src="store.js"></script>
<script src="fetch.js"></script>
<script>
  const out = document.getElementById('out');
  let passed = 0, failed = 0;

  function assert(label, got, expected) {
    const ok = JSON.stringify(got) === JSON.stringify(expected);
    out.textContent += (ok ? '✓' : '✗') + ' ' + label + (ok ? '' : '\n  got: ' + JSON.stringify(got) + '\n  exp: ' + JSON.stringify(expected)) + '\n';
    ok ? passed++ : failed++;
  }

  localStorage.clear();

  // loadLooks returns [] when empty
  assert('loadLooks empty', loadLooks(), []);

  // saveLooks + loadLooks round-trips
  const look = { id: '1', title: 'Test', starred: false, notes: '', pieces: [], createdAt: 1 };
  saveLooks([look]);
  assert('saveLooks+loadLooks', loadLooks(), [look]);

  // loadPrefs returns '' when empty
  localStorage.clear();
  assert('loadPrefs empty', loadPrefs(), '');

  // savePrefs + loadPrefs round-trips
  savePrefs('navy and cream only');
  assert('savePrefs+loadPrefs', loadPrefs(), 'navy and cream only');

  // parseProductPage: extracts og:image
  const html1 = `<html><head>
    <meta property="og:image" content="https://cdn.example.com/product.jpg">
    <meta property="og:title" content="Relaxed Linen Shirt - COS">
    <meta property="og:site_name" content="COS">
    <meta property="product:price:amount" content="79">
    <meta property="product:price:currency" content="USD">
  </head></html>`;
  const r1 = parseProductPage(html1, 'https://www.cos.com/en-us/product/123');
  assert('og:image', r1.imageUrl, 'https://cdn.example.com/product.jpg');
  assert('og:title trimmed', r1.name, 'Relaxed Linen Shirt');
  assert('og:site_name brand', r1.brand, 'COS');
  assert('product:price:amount USD', r1.price, '$79');

  // parseProductPage: twitter:image fallback
  const html2 = `<html><head>
    <meta name="twitter:image" content="https://cdn.example.com/tw.jpg">
    <title>Navy Chinos | Uniqlo</title>
  </head></html>`;
  const r2 = parseProductPage(html2, 'https://www.uniqlo.com/us/product/456');
  assert('twitter:image fallback', r2.imageUrl, 'https://cdn.example.com/tw.jpg');
  assert('title parsed brand separator', r2.name, 'Navy Chinos');
  assert('domain brand fallback', r2.brand, 'Uniqlo');

  // parseProductPage: price regex fallback
  const html3 = `<html><body>Price: $49.90</body></html>`;
  const r3 = parseProductPage(html3, 'https://store.example.com/item');
  assert('price regex fallback', r3.price, '$49.90');

  // parseProductPage: OFFICE pages expose Amplience product images in lazy attributes
  const officeHtml = `<html><head>
    <title>OFFICE Max Oxford Brogues Black Leather - Men's Smart Shoes</title>
  </head><body>
    <img alt="OFFICEMax Oxford BroguesBlack Leather"
         data-src="//cdn.media.amplience.net/i/office/5207000078_sd1.jpg?$newhighres$&amp;fmt=auto&amp;qlt=default">
    <span>£49.99</span>
  </body></html>`;
  const officeResult = parseProductPage(officeHtml, 'https://www.office.co.uk/view/product/office_catalog/1,70/5207000078090');
  assert('OFFICE lazy data-src image', officeResult.imageUrl, 'https://cdn.media.amplience.net/i/office/5207000078_sd1.jpg?$newhighres$&fmt=auto&qlt=default');
  assert('OFFICE pound price fallback', officeResult.price, '£49.99');

  // parseProductPage: chooses the largest OFFICE image from srcset
  const officeSrcsetHtml = `<html><body>
    <picture>
      <source srcset="//cdn.media.amplience.net/i/office/5207000078_sd1.jpg?$newhighres$&w=640 640w,
                      //cdn.media.amplience.net/i/office/5207000078_sd1.jpg?$newhighres$&w=1200 1200w">
    </picture>
  </body></html>`;
  const officeSrcsetResult = parseProductPage(officeSrcsetHtml, 'https://www.office.co.uk/view/product/office_catalog/1,70/5207000078090');
  assert('OFFICE srcset largest image', officeSrcsetResult.imageUrl, 'https://cdn.media.amplience.net/i/office/5207000078_sd1.jpg?$newhighres$&w=1200');

  // parseProductPage: extracts Product JSON-LD images
  const jsonLdHtml = `<html><head>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Mansel 4 Eye Derby Shoes",
        "image": [
          {"@type": "ImageObject", "url": "https://cdn.media.amplience.net/i/office/5089002514_sd1.jpg?$newhighres$"},
          "https://cdn.media.amplience.net/i/office/5089002514_dt1.jpg?$newhighres$"
        ]
      }
    <\/script>
  </head></html>`;
  const jsonLdResult = parseProductPage(jsonLdHtml, 'https://www.office.co.uk/view/product/office_catalog/7,500/5089002514');
  assert('Product JSON-LD image', jsonLdResult.imageUrl, 'https://cdn.media.amplience.net/i/office/5089002514_sd1.jpg?$newhighres$');

  out.textContent += '\n' + passed + ' passed, ' + failed + ' failed\n';
  localStorage.clear();
</script>
</body>
</html>
