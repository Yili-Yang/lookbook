<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Tests</title></head>
<body>
<pre id="out"></pre>
<script src="store.js"></script>
<script src="fetch.js"></script>
<script src="image.js"></script>
<script src="palette.js"></script>
<script src="ideas.js"></script>
<script>
  const out = document.getElementById('out');
  let passed = 0, failed = 0;

  // Without these a thrown error just stops the run and looks like a short list.
  window.addEventListener('error', event => {
    out.textContent += `\n✗ uncaught: ${event.message} (${event.filename}:${event.lineno})\n`;
    document.title = 'FAILED';
  });
  window.addEventListener('unhandledrejection', event => {
    out.textContent += `\n✗ uncaught in async: ${event.reason?.stack || event.reason}\n`;
    document.title = 'FAILED';
  });

  function assert(label, got, expected) {
    const ok = JSON.stringify(got) === JSON.stringify(expected);
    out.textContent += (ok ? '✓' : '✗') + ' ' + label + (ok ? '' : '\n  got: ' + JSON.stringify(got) + '\n  exp: ' + JSON.stringify(expected)) + '\n';
    ok ? passed++ : failed++;
  }

  localStorage.clear();

  // ── store ────────────────────────────────────────────────────────────────
  assert('loadLooks empty', loadLooks(), []);

  const look = { id: '1', title: 'Test', starred: false, notes: '', pieces: [], createdAt: 1 };
  assert('saveLooks reports success', saveLooks([look]), true);
  assert('saveLooks+loadLooks', loadLooks(), [look]);
  assert('storageUsage counts stored data', storageUsage() > 0, true);

  localStorage.clear();
  assert('loadPrefs empty', loadPrefs(), '');

  savePrefs('navy and cream only');
  assert('savePrefs+loadPrefs', loadPrefs(), 'navy and cream only');

  // ── parseProductPage: metadata ───────────────────────────────────────────
  const html1 = `<html><head>
    <meta property="og:image" content="https://cdn.example.com/product.jpg">
    <meta property="og:title" content="Relaxed Linen Shirt - COS">
    <meta property="og:site_name" content="COS">
    <meta property="product:price:amount" content="79">
    <meta property="product:price:currency" content="USD">
  </head></html>`;
  const r1 = parseProductPage(html1, 'https://www.cos.com/en-us/product/123');
  assert('og:image', r1.imageUrl, 'https://cdn.example.com/product.jpg');
  assert('og:title trimmed', r1.name, 'Relaxed Linen Shirt');
  assert('og:site_name brand', r1.brand, 'COS');
  assert('product:price:amount USD', r1.price, '$79');

  const html2 = `<html><head>
    <meta name="twitter:image" content="https://cdn.example.com/tw.jpg">
    <title>Navy Chinos | Uniqlo</title>
  </head></html>`;
  const r2 = parseProductPage(html2, 'https://www.uniqlo.com/us/product/456');
  assert('twitter:image fallback', r2.imageUrl, 'https://cdn.example.com/tw.jpg');
  assert('title parsed brand separator', r2.name, 'Navy Chinos');
  assert('domain brand fallback', r2.brand, 'Uniqlo');

  const html3 = `<html><body>Price: $49.90</body></html>`;
  const r3 = parseProductPage(html3, 'https://store.example.com/item');
  assert('price regex fallback', r3.price, '$49.90');
  assert('no images means empty list', r3.images, []);

  const html4 = `<html><body>Price: £45.00</body></html>`;
  assert('non-dollar price', parseProductPage(html4, 'https://store.example.com/x').price, '£45.00');

  const bannerHtml = `<html><body>
    <div class="promo">Free shipping over $9.99</div>
    <span class="product-price">$59.00</span>
  </body></html>`;
  assert('labelled price beats a promo banner',
    parseProductPage(bannerHtml, 'https://store.example.com/x').price, '$59.00');

  assert('amounts inside inline scripts are ignored',
    parseProductPage('<html><body><script>{"shipping":"$999.00"}</' + 'script>No price here</body></html>', 'https://store.example.com/x').price,
    '');

  // Uniqlo's page states its shipping fee in prose and never its own price.
  const shippingHtml = `<html><body><p>Shipping Fee: Standard shipping is $7.99.
    Free shipping for purchases over $99 or for in-store pickup.</p></body></html>`;
  assert('a shipping fee is not mistaken for the price',
    parseProductPage(shippingHtml, 'https://store.example.com/x').price, '');

  // ── Image candidates ─────────────────────────────────────────────────────
  assert('normalize resolves relative urls',
    normalizeImageUrl('/media/shirt.jpg', 'https://shop.example.com/p/1'),
    'https://shop.example.com/media/shirt.jpg');
  assert('normalize upgrades protocol-relative urls',
    normalizeImageUrl('//cdn.example.com/a.jpg', 'https://shop.example.com/p/1'),
    'https://cdn.example.com/a.jpg');
  assert('normalize decodes escaped slashes and entities',
    normalizeImageUrl('https:\\/\\/cdn.example.com\\/a.jpg?w=2&amp;h=3', 'https://shop.example.com'),
    'https://cdn.example.com/a.jpg?w=2&h=3');
  assert('normalize rejects data urls', normalizeImageUrl('data:image/png;base64,AAA', 'https://a.com'), '');
  assert('normalize rejects javascript urls', normalizeImageUrl('javascript:alert(1)', 'https://a.com'), '');

  // A logo returned as og:image is the classic wrong answer on Shopify stores.
  const shopify = `<html><head>
    <meta property="og:image" content="https://shop.example.com/cdn/shop/files/logo-seo.jpg?v=1">
    <meta property="og:title" content="Wool Runner Go - Allbirds">
  </head><body>
    <img src="//shop.example.com/cdn/shop/files/wool_runner_go_pdp-2000x2000.png?v=2&width=300"
         alt="Wool Runner Go" width="300" height="300">
    <img src="//shop.example.com/cdn/shop/files/spring-sale-banner.jpg?width=800" alt="" width="800" height="400">
  </body></html>`;
  const shop = parseProductPage(shopify, 'https://shop.example.com/products/wool-runner-go');
  assert('logo og:image loses to the real photo',
    shop.imageUrl,
    'https://shop.example.com/cdn/shop/files/wool_runner_go_pdp-2000x2000.png?v=2&width=1200');
  assert('promo banners are discarded',
    shop.images.some(image => image.url.includes('banner')),
    false);

  // "navy" must not be mistaken for a navigation asset.
  assert('junk words match whole words only',
    scoreImageCandidate({ url: 'https://cdn.example.com/dark_navy_shirt.jpg', origin: 'img' }) > 0,
    true);
  assert('logos are penalised',
    scoreImageCandidate({ url: 'https://cdn.example.com/logo.png', origin: 'og:image' }) < 0,
    true);
  assert('keyword match beats a generic name',
    scoreImageCandidate({ url: 'https://cdn.example.com/linen-shirt.jpg', origin: 'img' }, ['linen', 'shirt'])
      > scoreImageCandidate({ url: 'https://cdn.example.com/12345.jpg', origin: 'img' }, ['linen', 'shirt']),
    true);

  const jsonLd = `<html><head>
    <meta property="og:site_name" content="Shop Example">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Product","name":"Linen Shirt",
     "brand":{"@type":"Brand","name":"Sunspel"},
     "offers":{"@type":"Offer","price":"110.00","priceCurrency":"GBP"},
     "image":["https://cdn.example.com/ld-1.jpg","https://cdn.example.com/ld-2.jpg"]}
    </` + `script></head><body>Free delivery over $9.99</body></html>`;
  const ld = parseProductPage(jsonLd, 'https://shop.example.com/p');
  assert('json-ld product images are collected',
    ld.images.map(i => i.url).sort(),
    ['https://cdn.example.com/ld-1.jpg', 'https://cdn.example.com/ld-2.jpg']);
  // Without this the shipping threshold in the page body becomes the price.
  assert('json-ld offer beats a stray dollar amount', ld.price, '£110');
  assert('prices are written the way people write them',
    [formatPrice('215.0', 'USD'), formatPrice('215.50', 'USD'), formatPrice('1,299', 'USD')],
    ['$215', '$215.50', '$1299']);
  assert('json-ld brand beats the shop name', ld.brand, 'Sunspel');

  assert('aggregate offers fall back to the low price',
    parseProductPage(`<html><head><script type="application/ld+json">
      {"@type":"Product","offers":{"@type":"AggregateOffer","lowPrice":"49","priceCurrency":"USD"}}
    </` + `script></head></html>`, 'https://shop.example.com/p').price,
    '$49');

  const srcsetHtml = `<html><body>
    <img src="https://cdn.example.com/p_200.jpg"
         srcset="https://cdn.example.com/p_200.jpg 200w, https://cdn.example.com/p_1600.jpg 1600w"
         alt="Linen Shirt" width="1200" height="1600">
  </body></html>`;
  const srcset = parseProductPage(srcsetHtml, 'https://shop.example.com/p');
  assert('widest srcset entry wins', srcset.imageUrl, 'https://cdn.example.com/p_1600.jpg');

  // The same photo at several sizes should appear once.
  const variants = `<html><body>
    <img src="https://cdn.example.com/shirt.jpg?width=200" alt="shirt" width="600" height="800">
    <img src="https://cdn.example.com/shirt.jpg?width=900" alt="shirt" width="900" height="1200">
  </body></html>`;
  assert('size variants collapse to one candidate',
    parseProductPage(variants, 'https://shop.example.com/p').images.length, 1);

  assert('lazy-loaded attributes are read',
    parseProductPage('<html><body><img data-src="https://cdn.example.com/lazy-product.jpg" alt="Shirt" width="800" height="800"></body></html>', 'https://s.example.com/p').imageUrl,
    'https://cdn.example.com/lazy-product.jpg');

  assert('urls only present in inline scripts are found',
    parseProductPage('<html><body><script>var gallery={"main":"https://cdn.example.com/product/hero-1200x1600.jpg"}</' + 'script></body></html>', 'https://s.example.com/p').imageUrl,
    'https://cdn.example.com/product/hero-1200x1600.jpg');

  assert('shopify thumbnails are requested at full size',
    upgradeImageUrl('https://s.example.com/cdn/shop/files/a.jpg?v=1&width=180'),
    'https://s.example.com/cdn/shop/files/a.jpg?v=1&width=1200');
  assert('other urls are left alone',
    upgradeImageUrl('https://cdn.example.com/a.jpg?width=180'),
    'https://cdn.example.com/a.jpg?width=180');

  assert('size hints are read from the url', sizeHint('https://cdn.example.com/a_2000x2000.jpg'), 2000);
  assert('size hints are read from query parameters', sizeHint('https://cdn.example.com/a.jpg?wid=1200'), 1200);

  // Shops that give every page the same title still name the product in the URL.
  assert('keywords come from the url slug too',
    keywordsFrom('Allbirds Shoes', 'https://www.allbirds.com/products/mens-wool-runner-go'),
    ['allbirds', 'shoes', 'wool', 'runner']);

  const genericTitle = `<html><head><meta property="og:title" content="Allbirds Shoes"></head><body>
    <img src="https://cdn.example.com/tree_dasher_pdp.png" alt="" width="900" height="900">
    <img src="https://cdn.example.com/wool_runner_pdp.png" alt="" width="900" height="900">
  </body></html>`;
  assert('the product named in the url wins',
    parseProductPage(genericTitle, 'https://www.allbirds.com/products/mens-wool-runner').imageUrl,
    'https://cdn.example.com/wool_runner_pdp.png');

  assert('shop error pages are recognised',
    ['404 Not Found', 'Just a moment...', 'Origin DNS error', 'Attention Required!', 'Linen Shirt']
      .map(name => looksLikeErrorPage({ name })),
    [true, true, true, true, false]);

  // ── Reader (markdown) fallback ───────────────────────────────────────────
  const markdown = `Title: AIRism Cotton T-Shirt | UNIQLO US

URL Source: https://www.uniqlo.com/us/en/products/E465185-000/00

Markdown Content:
![Image 3: logo](https://image.uniqlo.com/assets/logo.svg)
![Image 5: AIRism Cotton T-Shirt](https://image.uniqlo.com/UQ/goods/465185/item/goods_00_465185_3x4.jpg)
Price: $19.90`;
  const reader = parseReaderText(markdown, 'https://www.uniqlo.com/us/en/products/E465185-000/00');
  assert('reader title', reader.name, 'AIRism Cotton T-Shirt');
  assert('reader price', reader.price, '$19.90');
  assert('reader picks the product photo over the logo',
    reader.imageUrl,
    'https://image.uniqlo.com/UQ/goods/465185/item/goods_00_465185_3x4.jpg');

  // ── Image helpers ────────────────────────────────────────────────────────
  assert('image proxy encodes the target url',
    proxiedImageUrl('https://cdn.example.com/a b.jpg?x=1').startsWith('https://images.weserv.nl/?url=https%3A%2F%2Fcdn.example.com%2Fa%20b.jpg%3Fx%3D1'),
    true);
  assert('data url size estimate', approximateBytes('data:image/jpeg;base64,' + 'A'.repeat(4000)), 3000);
  assert('bytes formatted', [formatBytes(512), formatBytes(2048), formatBytes(3 * 1024 * 1024)],
    ['512\u00a0B', '2\u00a0KB', '3.0\u00a0MB']);

  // ── Palette ──────────────────────────────────────────────────────────────
  assert('colours are named perceptually',
    [[252, 251, 249], [40, 50, 80], [110, 106, 68], [230, 221, 200]].map(rgb => nearestWardrobeColor(rgb).name),
    ['white', 'navy', 'olive', 'ecru']);

  // Studio backdrops would otherwise make every wardrobe read as white.
  assert('near-white backdrops are ignored, garments are not',
    [isBackdrop([252, 252, 250]), isBackdrop([232, 223, 203]), isBackdrop([38, 48, 76])],
    [true, false, false]);
  // Ecru, sand, tan and camel sit in the same range as skin, so they must not
  // be filtered out as "not clothing" — cropping keeps faces out instead.
  assert('neutral garment colours survive the filters',
    ['ecru', 'sand', 'tan', 'camel', 'cream'].map(name => isBackdrop(wardrobeColor(name).rgb)),
    [false, false, false, false, false]);

  assert('pairings suggest what is missing',
    suggestedAccents(['ecru', 'olive']).includes('navy'), true);
  assert('a colour does not pair with itself',
    [colorsGoTogether('ecru', 'navy'), colorsGoTogether('ecru', 'ecru')], [true, false]);

  assert('style notes are read for colours',
    paletteFromText('mostly navy and olive, nothing shiny').map(entry => entry.name),
    ['olive', 'navy']);
  // "no black" must not be read as a request for black.
  assert('refused colours are not recommended',
    [avoidedColorNames('navy and olive, no black please'), paletteFromText('navy and olive, no black please').map(e => e.name)],
    [['black'], ['olive', 'navy']]);

  // ── Reading style writing ────────────────────────────────────────────────
  const blogText = `Title: Style Archives

![Image 1](https://hespokestyle.com/wp-content/uploads/navy-blue-hopsack-sport-coat-with-white-linen-pants-outfit.jpg)

### [The case for a linen camp collar shirt](https://hespokestyle.com/linen-camp-collar-shirt/)
An ecru linen camp collar shirt is the easiest thing to wear all summer, over olive chinos.`;
  const blogIdeas = extractGarmentIdeas(blogText, { name: 'He Spoke Style', url: 'https://hespokestyle.com/' });
  const byName = Object.fromEntries(blogIdeas.map(idea => [`${idea.material} ${idea.garment}`.trim(), idea]));

  assert('garments are picked out of the writing',
    Boolean(byName['linen camp collar shirt'] && byName['hopsack sport coat'] && byName['olive chinos'] === undefined),
    true);
  assert('garments are categorised',
    [byName['linen camp collar shirt'].category, byName['hopsack sport coat'].category, byName['chinos'].category],
    ['top', 'outer', 'bottom']);
  // Image slugs describe whole outfits, so URLs are read as words.
  assert('colours are read from image slugs',
    byName['hopsack sport coat'].colours, ['navy']);
  assert('colours are read from prose', byName['linen camp collar shirt'].colours, ['ecru']);
  // ── Linking back to the post ─────────────────────────────────────────────
  const feed = `Title: Style Archives

URL Source: https://hespokestyle.com/category/style/

Markdown Content:
*   [Read All](https://hespokestyle.com/blog/)
*   [Style](https://hespokestyle.com/category/style/)

![Image 1](https://hespokestyle.com/wp-content/uploads/2026/07/navy-blue-hopsack-sport-coat-outfit.jpg)

### [Why A Navy Hopsack Sport Coat Earns Its Keep](https://hespokestyle.com/2026/07/navy-hopsack-sport-coat/ "Navy hopsack")
A navy hopsack sport coat is the most useful jacket you can own.

![Image 2](https://hespokestyle.com/wp-content/themes/images/right-arrow.svg)

### [The Case For A Linen Camp Collar Shirt](https://hespokestyle.com/2026/06/linen-camp-collar-shirt/)
An ecru linen camp collar shirt is the easiest thing to wear all summer.`;

  const feedSource = { name: 'He Spoke Style', url: 'https://hespokestyle.com/category/style/' };
  const posts = extractPosts(feed, feedSource);
  assert('posts are found, navigation is not',
    posts.map(post => post.title),
    ['Why A Navy Hopsack Sport Coat Earns Its Keep', 'The Case For A Linen Camp Collar Shirt']);
  assert('a link with a markdown title attribute is still read',
    posts[0].url, 'https://hespokestyle.com/2026/07/navy-hopsack-sport-coat/');
  assert('the post carries the photograph above it',
    posts[0].image, 'https://hespokestyle.com/wp-content/uploads/2026/07/navy-blue-hopsack-sport-coat-outfit.jpg');
  // An arrow icon is not a picture of the outfit.
  assert('decorative images are not used as the picture', posts[1].image, '');

  const linkedIdeas = extractGarmentIdeas(feed, feedSource);
  const shirtIdea = linkedIdeas.find(idea => idea.garment === 'camp collar shirt');
  const coatIdea = linkedIdeas.find(idea => idea.garment === 'sport coat');
  assert('each idea points at the post it came from',
    [coatIdea.posts[0].title, shirtIdea.posts[0].title],
    ['Why A Navy Hopsack Sport Coat Earns Its Keep', 'The Case For A Linen Camp Collar Shirt']);
  assert('the post keeps the name of who wrote it', shirtIdea.posts[0].source, 'He Spoke Style');

  assert('blog colour words map onto wardrobe colours',
    extractGarmentIdeas('an off-white oxford shirt and khaki chinos', { name: 'x', url: 'y' })
      .flatMap(idea => idea.colours).sort(),
    ['cream', 'tan']);

  // ── Building outfits ─────────────────────────────────────────────────────
  const sampleIdeas = mergeIdeas([
    { garment: 'camp collar shirt', category: 'top', material: 'linen', mentions: 5, colours: ['ecru'], source: 'He Spoke Style', sourceUrl: '',
      posts: [{ title: 'The Case For A Linen Camp Collar Shirt', url: 'https://blog.example.com/linen-camp-collar-shirt', image: '', source: 'He Spoke Style' }] },
    { garment: 'chinos', category: 'bottom', material: '', mentions: 4, colours: [], source: 'He Spoke Style', sourceUrl: '', posts: [] },
    { garment: 'loafers', category: 'shoes', material: 'suede', mentions: 3, colours: [], source: 'GQ Style', sourceUrl: '', posts: [] },
  ]);
  const outfits = buildOutfitIdeas({
    ideas: sampleIdeas,
    sources: [{ name: 'He Spoke Style', url: 'https://hespokestyle.com/' }],
    palette: ['ecru', 'navy'],
    accents: ['olive'],
    preferences: '',
  });
  assert('an outfit pairs a top with a bottom',
    outfits.length && outfits[0].pieces.map(piece => piece.category), ['top', 'bottom']);
  assert('the write-up agrees with itself grammatically',
    [/chinos finish it/.test(outfits[0].why), /\bpiecess?\b/.test(outfits[0].why)], [true, false]);
  assert('the top keeps a colour the wardrobe already has', outfits[0].pieces[0].colour, 'ecru');
  assert('the two colours work together',
    colorsGoTogether(outfits[0].colours[0], outfits[0].colours[1]), true);
  assert('each piece reads as something to shop for', outfits[0].pieces[0].label, 'ecru linen camp collar shirt');
  assert('the suggestion carries the posts behind it',
    outfits[0].inspiration.map(post => post.url), ['https://blog.example.com/linen-camp-collar-shirt']);

  // A post that merely sat next to the mention loses to one about the garment.
  const relevantFirst = inspirationFor([{
    garment: 'camp collar shirt',
    posts: [
      { title: 'Gray Glen Check Suit Vest', url: 'https://blog.example.com/suit-vest', image: 'https://img/a.jpg', source: 'x' },
      { title: 'The Case For A Linen Camp Collar Shirt', url: 'https://blog.example.com/camp-collar', image: '', source: 'x' },
    ],
  }]);
  assert('posts about the garment come first, and off-topic ones drop out',
    relevantFirst.map(post => post.title), ['The Case For A Linen Camp Collar Shirt']);
  // Chinos are cotton whether or not the writer said so, and a search needs it.
  assert('a garment with no stated cloth still gets one', outfits[0].pieces[1].label, 'navy cotton chinos');
  // But a default must never be quoted back as something the writer claimed.
  assert('only the writer\'s own words are credited to them',
    [/cotton chinos keep coming up/i.test(outfits[0].why), /linen camp collar shirts keep coming up/i.test(outfits[0].why)],
    [false, true]);


  // Five suggestions that are all navy are one suggestion.
  const variedIdeas = mergeIdeas([
    { garment: 'camp collar shirt', category: 'top', material: 'linen', mentions: 5, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'oxford shirt', category: 'top', material: 'cotton', mentions: 4, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'crewneck sweater', category: 'top', material: 'merino', mentions: 3, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'chinos', category: 'bottom', material: 'cotton', mentions: 4, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'pleated trousers', category: 'bottom', material: 'wool', mentions: 3, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'wide-leg trousers', category: 'bottom', material: 'linen', mentions: 2, colours: [], source: 'a', sourceUrl: '' },
  ]);
  const varied = buildOutfitIdeas({
    ideas: variedIdeas, sources: [], palette: ['ecru', 'navy'], accents: ['olive', 'camel'], preferences: '',
  });
  assert('suggestions do not all come back in one colour',
    new Set(varied.map(outfit => outfit.colours[0])).size, varied.length);

  // A midi skirt is a fine suggestion, but not for a wardrobe that shows no
  // sign of wanting one.
  const skirtIdeas = mergeIdeas([
    { garment: 'oxford shirt', category: 'top', material: 'cotton', mentions: 4, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'midi skirt', category: 'bottom', material: 'linen', mentions: 9, colours: [], source: 'a', sourceUrl: '' },
    { garment: 'pleated trousers', category: 'bottom', material: 'wool', mentions: 1, colours: [], source: 'a', sourceUrl: '' },
  ]);
  const neutralWardrobe = { ideas: skirtIdeas, sources: [], palette: ['ecru'], accents: ['navy'] };
  assert('skirts wait for a wardrobe that wants them',
    buildOutfitIdeas({ ...neutralWardrobe, preferences: 'linen, relaxed tailoring' })[0].pieces[1].garment,
    'pleated trousers');
  assert('skirts are used when the wardrobe asks for them',
    buildOutfitIdeas({ ...neutralWardrobe, preferences: 'midi skirts and linen blouses' })[0].pieces[1].garment,
    'midi skirt');

  assert('refused colours stay out of outfits',
    buildOutfitIdeas({
      ideas: sampleIdeas,
      sources: [],
      palette: ['ecru', 'navy'],
      accents: ['olive'],
      preferences: 'no ecru, please',
    })[0].colours.includes('ecru'),
    false);

  // ── Knowing which garment a photo should show ────────────────────────────
  assert('a product name is read for what it is',
    ['Ecru Linen Camp Collar Shirt', 'Slim Leg Wool Trousers', 'Suede Loafers', 'A nice thing']
      .map(name => inferGarment(name)?.category ?? null),
    ['top', 'bottom', 'shoes', null]);
  assert('the most specific garment in the name wins',
    inferGarment('Oxford Shirt in Ecru').garment, 'oxford shirt');
  // Shops write "Chino" and "Pleated Pant" for what everyone else pluralises.
  assert('a singular product name is still recognised',
    ['Jace Cotton Stretch Chino in Ecru', 'Classic Fit Pleated Pant in Olive', 'Slim Denim Trouser']
      .map(name => inferGarment(name)?.category ?? null),
    ['bottom', 'bottom', 'bottom']);
  // "Short sleeve" is not a pair of shorts.
  assert('a sleeve length is not mistaken for shorts',
    inferGarment('Ecru Linen Short Sleeve Camp Collar Shirt').category, 'top');

  // A product page shows the whole outfit as often as the piece being sold.
  const outfitPhotos = [
    { url: 'https://cdn.example.com/model-full-length-outfit.jpg', alt: 'Model wearing the look', score: 60 },
    { url: 'https://cdn.example.com/wool-trousers-front.jpg', alt: 'Wool trousers', score: 50 },
    { url: 'https://cdn.example.com/oxford-shirt-detail.jpg', alt: 'Oxford shirt', score: 55 },
  ];
  assert('the photo of the garment asked for comes first',
    preferGarmentPhotos(outfitPhotos, { garment: 'trousers', category: 'bottom' })[0].url,
    'https://cdn.example.com/wool-trousers-front.jpg');
  assert('asking for a shirt gets the shirt instead',
    preferGarmentPhotos(outfitPhotos, { garment: 'oxford shirt', category: 'top' })[0].url,
    'https://cdn.example.com/oxford-shirt-detail.jpg');
  assert('with nothing to go on, the order is left alone',
    preferGarmentPhotos(outfitPhotos, null)[0].url,
    'https://cdn.example.com/model-full-length-outfit.jpg');

  // ── Finding a product to buy ─────────────────────────────────────────────
  const searchBody = `
    [Sponsored](https://duckduckgo.com/l/?uddg=https%3A%2F%2Fduckduckgo.com%2Fy.js%3Fad_domain%3Dquince.com)
    [Drake's](https://duckduckgo.com/l/?uddg=https%3A%2F%2Fus.drakes.com%2Fproducts%2Fecru-linen-camp-collar-shirt)
    [Amazon](https://duckduckgo.com/l/?uddg=https%3A%2F%2Fwww.amazon.com%2Flinen-shirt%2Fs%3Fk%3Dlinen)`;
  assert('sponsored and in-house links are dropped from results',
    extractSearchResultUrls(searchBody),
    ['https://us.drakes.com/products/ecru-linen-camp-collar-shirt', 'https://www.amazon.com/linen-shirt/s?k=linen']);

  const words = ['ecru', 'linen', 'camp', 'collar', 'shirt'];
  assert('a matching product page is preferred',
    scoreProductUrl('https://us.drakes.com/products/ecru-linen-camp-collar-shirt', words) > 0, true);
  // Shops that use no /product/ prefix still have to work.
  assert('a descriptive address counts as a product',
    scoreProductUrl('https://www.asket.com/en-us/mens-linen-shirt-ecru', words) > 0, true);
  assert('a product identified by sku is accepted',
    scoreProductUrl('https://www.charlestyrwhitt.com/us/ecru-linen-shirt/CSF0123ECR.html', words) > 0, true);
  assert('search and listing pages are rejected',
    [scoreProductUrl('https://www.amazon.com/linen-shirt/s?k=linen+shirt', words),
     scoreProductUrl('https://www.nordstrom.com/browse/men/clothing/shirts', words),
     scoreProductUrl('https://www.etsy.com/market/linen_shirt', words),
     scoreProductUrl('https://www.ebay.com/shop/linen-shirt?_nkw=linen+shirt', words),
     scoreProductUrl('https://www.jcrew.com/buy/ecru-linen-shirts-1aaz00a', words),
     scoreProductUrl('https://www.target.com/s/ecru+linen+shirt', words),
     // A path that is only the words searched for is a department, not an item.
     scoreProductUrl('https://www.zappos.com/ecru-linen-shirt', words),
     scoreProductUrl('https://www.revolve.com/v/ecru-linen-shirt', words),
     // A /products/ path can still be a department.
     scoreProductUrl('https://www2.hm.com/en_us/women/products/shirts/linen.html', words)],
    [0, 0, 0, 0, 0, 0, 0, 0, 0]);
  assert('a short slug under a product path is still a product',
    scoreProductUrl('https://greenfieldclothiers.com/products/ecru-linen-shirt', words) > 0, true);
  // Shops name the page for one of them; the search asked for several.
  assert('a singular product name matches a plural search',
    scoreProductUrl('https://shop.example.com/products/slim-denim-trouser', ['denim', 'trousers']) > 0, true);
  assert('woocommerce category pages are rejected',
    scoreProductUrl('https://military-outfitters.com/product-category/navy-linen-shirts', words), 0);
  // Otherwise "navy denim shirt" finds shirts belonging to the navy.
  assert('colour names are disambiguated for searching',
    [unambiguous('navy denim shirt'), unambiguous('ecru linen shirt')],
    ['navy blue denim shirt', 'ecru linen shirt']);

  assert('a product page about something else is rejected',
    scoreProductUrl('https://shop.example.com/products/wool-overcoat', words), 0);
  assert('marketplace listings lose to a brand\'s own shop',
    scoreProductUrl('https://us.drakes.com/products/ecru-linen-camp-collar-shirt', words)
      > scoreProductUrl('https://www.amazon.com/dp/B07R2F6WLK/ecru-linen-camp-collar-shirt', words),
    true);

  // Something you can search for and buy beats a word that merely appears often.
  const specificity = { palette: [], accents: [], preferenceWords: [] };
  assert('specific garments outrank generic ones',
    scoreIdea({ garment: 'camp collar shirt', material: 'linen', mentions: 1, colours: [], sources: ['a'] }, specificity)
      > scoreIdea({ garment: 'shirt', material: '', mentions: 36, colours: [], sources: ['a', 'b', 'c'] }, specificity),
    true);

  // ── Reading a real image ─────────────────────────────────────────────────
  function swatchDataUrl(rgb, { background = '#ffffff' } = {}) {
    const canvas = document.createElement('canvas');
    canvas.width = 300;
    canvas.height = 400;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, 300, 400);
    ctx.fillStyle = `rgb(${rgb.join(',')})`;
    ctx.fillRect(30, 40, 240, 320);
    return canvas.toDataURL('image/jpeg', 0.9);
  }

  (async () => {
    const olive = await extractPaletteFromImage(swatchDataUrl([107, 104, 66]));
    assert('a photo is read down to its colour', olive[0]?.name, 'olive');

    // The white backdrop must not drown out a pale garment.
    const ecru = await extractPaletteFromImage(swatchDataUrl([232, 223, 203]));
    assert('a pale garment is not mistaken for the backdrop', ecru[0]?.name, 'ecru');

    const wardrobe = await paletteFromLooks([{
      pieces: [
        { imageData: swatchDataUrl([38, 48, 76]) },
        { imageData: swatchDataUrl([232, 223, 203]) },
        { imageData: swatchDataUrl([232, 223, 203]) },
      ],
    }]);
    assert('the wardrobe palette is ordered by how much is owned',
      wardrobe.map(entry => entry.name), ['ecru', 'navy']);

    // ── Framing a photo on half the body ───────────────────────────────────
    // Built without canvas.toBlob, which never completes under the virtual
    // clock the headless test runner uses.
    function photo(draw, width = 600, height = 800) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      draw(ctx, width, height);

      const [meta, encoded] = canvas.toDataURL('image/jpeg', 0.9).split(',');
      const binary = atob(encoded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return new Blob([bytes], { type: meta.match(/:(.*?);/)[1] });
    }

    // A standing figure: a narrow column filling the height, navy on top and
    // olive below, so a crop can be checked by the colour that survives it.
    const fullLength = photo((ctx, w, h) => {
      ctx.fillStyle = 'rgb(38,48,76)';
      ctx.fillRect(w * 0.34, h * 0.06, w * 0.32, h * 0.42);
      ctx.fillStyle = 'rgb(107,104,66)';
      ctx.fillRect(w * 0.34, h * 0.48, w * 0.32, h * 0.46);
    });
    // A garment photographed on its own fills the width instead.
    const flatLay = photo((ctx, w, h) => {
      ctx.fillStyle = 'rgb(38,48,76)';
      ctx.fillRect(w * 0.08, h * 0.2, w * 0.84, h * 0.55);
    });

    const framedTop = await renderStoredImage(fullLength, { frame: 'auto', category: 'top' });
    const framedBottom = await renderStoredImage(fullLength, { frame: 'auto', category: 'bottom' });
    assert('a full-length photo is framed on the half being worn',
      [framedTop.frame, framedBottom.frame], ['top', 'bottom']);
    assert('a garment shot on its own is left whole',
      (await renderStoredImage(flatLay, { frame: 'auto', category: 'top' })).frame, 'full');

    // A garment photographed edge to edge fills a tall frame just as a person
    // does; only its width tells them apart.
    const edgeToEdge = photo((ctx, w, h) => {
      ctx.fillStyle = 'rgb(38,48,76)';
      ctx.fillRect(0, 0, w, h);
    });
    assert('a garment filling the whole frame is left whole',
      (await renderStoredImage(edgeToEdge, { frame: 'auto', category: 'top' })).frame, 'full');

    // A photograph taken somewhere real has no plain backdrop to measure against.
    const busyBackground = photo((ctx, w, h) => {
      for (let y = 0; y < h; y += 20) {
        ctx.fillStyle = `hsl(${(y / 8) % 360}, 60%, 55%)`;
        ctx.fillRect(0, y, w, 20);
      }
      ctx.fillStyle = 'rgb(38,48,76)';
      ctx.fillRect(w * 0.34, h * 0.06, w * 0.32, h * 0.88);
    });
    assert('a photo with no plain backdrop is not guessed at',
      (await renderStoredImage(busyBackground, { frame: 'auto', category: 'top' })).frame, 'full');
    assert('shoes are never cropped in half',
      (await renderStoredImage(fullLength, { frame: 'auto', category: 'shoes' })).frame, 'full');

    // The crop has to actually keep the right half of the picture.
    const colourOf = async stored => (await extractPaletteFromImage(stored.dataUrl))[0]?.name;
    assert('the top frame keeps what is worn on top', await colourOf(framedTop), 'navy');
    assert('the bottom frame keeps what is worn below', await colourOf(framedBottom), 'olive');

    assert('a photo can be re-framed without downloading it again',
      (await reframeImage(fullLength, 'bottom')).frame, 'bottom');

    // Half a photo is a wide strip, mostly empty backdrop either side of the
    // person; trimming to the subject keeps the garment large in the card.
    assert('a framed photo is trimmed to the subject, not left letterboxed',
      framedTop.width / framedTop.height < 1.2, true);

    out.textContent += '\n' + passed + ' passed, ' + failed + ' failed\n';
    document.title = failed === 0 ? 'ALL PASS' : failed + ' FAILED';
    localStorage.clear();
  })();
</script>
</body>
</html>
