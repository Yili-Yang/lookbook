<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Lookbook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a17'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='20' fill='%23f5f1ea' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="topbar">
      <h1>Lookbook</h1>
      <div class="topbar-actions">
        <button class="btn-ghost" id="btn-prefs">Preferences</button>
        <button class="btn-ghost" id="btn-ideas">Ideas</button>
        <button class="btn-primary" id="btn-add">+ Add Look</button>
      </div>
    </div>
    <nav class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="starred">★ Starred</button>
    </nav>
  </header>

  <main id="looks-grid"></main>

  <!-- Add Look modal -->
  <div id="modal-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Look</h2>
        <button class="btn-icon" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label for="look-title">Look title</label>
          <input type="text" id="look-title" placeholder="e.g. Navy linen weekend" autocomplete="off">
        </div>
        <p class="modal-hint">Paste a product page link and pick the photo you want. Each photo is copied into your lookbook, so it keeps working even if the shop's link stops.</p>
        <div id="pieces-container"></div>
        <button class="btn-ghost btn-sm" id="btn-add-piece">+ Add piece</button>
        <div class="form-field" style="margin-top:16px">
          <label for="look-notes">Notes <span class="label-optional">(optional)</span></label>
          <textarea id="look-notes" placeholder="Where you'd wear it, fit notes..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-cancel">Cancel</button>
        <button class="btn-primary" id="btn-save" disabled>Save Look</button>
      </div>
    </div>
  </div>

  <!-- Ideas -->
  <div id="ideas-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ideas-title">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="ideas-title">Ideas for you</h2>
        <button class="btn-icon" id="ideas-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <section class="palette-block">
          <h3 class="section-label">Your colours</h3>
          <div id="ideas-palette" class="palette-strip"></div>
        </section>
        <div id="ideas-status" class="slot-status hidden"></div>
        <div id="ideas-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-ideas-refresh">Read the blogs again</button>
        <button class="btn-primary" id="btn-ideas-find">Find ideas</button>
      </div>
    </div>
  </div>

  <!-- Preferences drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="prefs-drawer" class="drawer hidden" aria-label="Style preferences">
    <div class="drawer-header">
      <h2>My Style</h2>
      <button class="btn-icon" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <textarea id="prefs-text" placeholder="Write anything — fits you like, colors, brands, what to avoid, wardrobe gaps..."></textarea>
    <p class="drawer-foot" id="storage-meter"></p>
  </aside>

  <script src="store.js"></script>
  <script src="fetch.js"></script>
  <script src="image.js"></script>
  <script src="palette.js"></script>
  <script src="ideas.js"></script>
  <script src="app.js"></script>
</body>
</html>
