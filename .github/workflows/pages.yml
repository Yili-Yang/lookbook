name: Publish the lookbook

# Copies lookbook/ onto the gh-pages branch. GitHub Pages then serves that
# branch for free. The Actions token cannot create a Pages site by itself
# (enablement fails with "Resource not accessible by integration"), so the
# first publish is: run this workflow, then point Settings → Pages at gh-pages.
on:
  push:
    branches: [master]
    paths:
      - 'lookbook/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish lookbook/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./lookbook
          force_orphan: true
