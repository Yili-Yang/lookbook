name: Publish the lookbook

# Publishes lookbook/ as the site, so there is somewhere to open and use it
# without running a server. Everything it stores stays in your own browser, so
# the published copy is still private to whoever opens it.
on:
  push:
    branches: [master]
    paths:
      - 'lookbook/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on the first time this runs, so there is no
      # setting to find in the repository beforehand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lookbook

      - id: deployment
        uses: actions/deploy-pages@v4
